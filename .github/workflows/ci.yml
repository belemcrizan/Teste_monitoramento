name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and integration tests
        run: python -m pytest --cov=vertice_surveillance --cov-report=term-missing --cov-fail-under=80
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src/vertice_surveillance
      - name: Build package
        run: python -m build
      - name: Execute golden cases
        run: python -m vertice_surveillance demo --policy configs/policy.example.json

